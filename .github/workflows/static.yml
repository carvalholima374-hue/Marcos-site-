name: Deploy static content to Pages
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
    PUBLIC_WHATSAPP_NUMBER: 5511913294336
    PUBLIC_WHATSAPP_MESSAGE: "Olá, vim pelo site e gostaria de agendar uma avaliação gratuita!"
    PUBLIC_BUSINESS_NAME: "Marcos Prótese Capilar"
    PUBLIC_SITE_URL: "https://marcosprotesecapilar.com.br"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # <-- pasta de output do SvelteKit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
